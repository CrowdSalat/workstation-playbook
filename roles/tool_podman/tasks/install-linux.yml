---
- name: Install Podman CLI and podman-compose via the Fedora RPM channel
  ansible.builtin.include_role:
    name: "package_manager_{{ fedora_package_manager | default('rpm_ostree') }}"
  vars:
    package_manager_rpm_ostree_packages: "{{ tool_podman_linux_packages }}"
    package_manager_dnf_packages: "{{ tool_podman_linux_packages }}"

- name: Install Podman Desktop via Flatpak package manager role
  ansible.builtin.include_role:
    name: package_manager_flatpak
  vars:
    package_manager_flatpak_packages: "{{ tool_podman_linux_flatpak_packages }}"
