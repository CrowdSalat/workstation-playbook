---
tool_git_user_name: "CrowdSalat"
tool_git_user_email: "15823789+CrowdSalat@users.noreply.github.com"
tool_git_default_branch: "main"

tool_git_enable_ssh_signing: true
# Published by tool_ssh, which must run first. The fallback keeps tool_git
# usable on its own (for example when filtered by tag).
tool_git_signing_key: "{{ workstation_ssh_git_public_key | default(ansible_facts['env']['HOME'] ~ '/.ssh/id_ed25519_github.pub', true) }}"
tool_git_completion_candidates:
  - /opt/homebrew/etc/bash_completion.d/git-completion.bash
  - /usr/local/etc/bash_completion.d/git-completion.bash
  - /usr/share/bash-completion/completions/git
  - /etc/bash_completion.d/git
tool_git_aliases:
  - { name: st, value: "status -sb" }
  - { name: co, value: "checkout" }
  - { name: br, value: "branch" }
  - { name: ci, value: "commit" }
  - { name: last, value: "log -1 HEAD" }
  - { name: lg, value: "log --oneline --graph --decorate --all" }
  - { name: unstage, value: "reset HEAD --" }
