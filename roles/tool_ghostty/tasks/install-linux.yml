---
- name: Install Ghostty via the Fedora RPM channel
  ansible.builtin.include_role:
    name: "package_manager_{{ fedora_package_manager | default('rpm_ostree') }}"
  vars:
    package_manager_rpm_ostree_packages: "{{ tool_ghostty_linux_packages }}"
    package_manager_dnf_packages: "{{ tool_ghostty_linux_packages }}"
