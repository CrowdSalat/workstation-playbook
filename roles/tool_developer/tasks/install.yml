---
- name: Map configured shells to their non-interactive profile files
  ansible.builtin.set_fact:
    tool_developer_profile_files: >-
      {{ (tool_developer_profile_files | default([])) +
         [{'name': shell.name,
           'path': tool_developer_home
             ~ ('/.bash_profile' if shell.name == 'bash' else '/.zprofile')}] }}
  loop: "{{ shell_rc_files | default([]) }}"
  loop_control:
    loop_var: shell
  when: shell.name in ['bash', 'zsh']

- name: Check mise installation
  ansible.builtin.stat:
    path: "{{ tool_developer_mise_bin }}"
  register: tool_developer_mise_stat

- name: Install mise when missing
  ansible.builtin.shell: curl https://mise.run | sh
  args:
    executable: /bin/bash
    creates: "{{ tool_developer_mise_bin }}"
  environment:
    HOME: "{{ tool_developer_home }}"
  when: not tool_developer_mise_stat.stat.exists
  register: tool_developer_mise_bootstrap
  changed_when: tool_developer_mise_bootstrap.rc == 0

- name: Enable mise activation in interactive rc files
  ansible.builtin.blockinfile:
    path: "{{ rc_file.path }}"
    marker: "{{ tool_developer_activate_marker }}"
    block: |
      eval "$(~/.local/bin/mise activate {{ rc_file.name }})"
    create: true
  loop: "{{ shell_rc_files | default([]) }}"
  loop_control:
    loop_var: rc_file

- name: Add mise shims for non-interactive and login shells
  ansible.builtin.blockinfile:
    path: "{{ profile_file.path }}"
    marker: "{{ tool_developer_shims_marker }}"
    block: |
      eval "$(~/.local/bin/mise activate {{ profile_file.name }} --shims)"
    create: true
  loop: "{{ tool_developer_profile_files }}"
  loop_control:
    loop_var: profile_file

- name: Template global mise config
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ tool_developer_home }}/.config/mise/config.toml"
    mode: '0644'