---
- name: Map configured shells to their non-interactive profile files
  ansible.builtin.set_fact:
    tool_developer_profile_files: >-
      {{ (tool_developer_profile_files | default([])) +
         [{'name': shell.name,
           'path': tool_developer_home
             ~ ('/.bash_profile' if shell.name == 'bash' else '/.zprofile')}] }}
  loop: "{{ shell_rc_files | default([]) }}"
  loop_control:
    loop_var: shell
  when: shell.name in ['bash', 'zsh']

- name: Check mise installation
  ansible.builtin.stat:
    path: "{{ tool_developer_home }}/.local/bin/mise"
  register: tool_developer_mise_stat

- name: Install mise when missing
  ansible.builtin.shell: curl https://mise.run | sh
  args:
    executable: /bin/bash
    creates: "{{ tool_developer_home }}/.local/bin/mise"
  environment:
    HOME: "{{ tool_developer_home }}"
  when: not tool_developer_mise_stat.stat.exists
  register: tool_developer_mise_bootstrap
  changed_when: tool_developer_mise_bootstrap.rc == 0

# Only for a mise that already existed: a fresh bootstrap is current by
# definition, and skipping the call avoids a pointless release download.
#
# changed_when: mise prints "mise is already up to date" when there is nothing
# to do, so absence of that line means it moved. mise's own minimum_release_age
# setting still gates how new a release may be, so this never jumps to a build
# published within that window.
- name: Update mise when a newer release is available
  ansible.builtin.command: "{{ tool_developer_home }}/.local/bin/mise self-update --yes"
  environment:
    HOME: "{{ tool_developer_home }}"
  register: tool_developer_mise_self_update
  changed_when: "'already up to date' not in (tool_developer_mise_self_update.stdout | default(''))"
  when:
    - tool_developer_mise_stat.stat.exists
    - tool_developer_mise_self_update | bool

- name: Enable mise activation in interactive rc files
  ansible.builtin.blockinfile:
    path: "{{ rc_file.path }}"
    marker: "# {mark} ANSIBLE MANAGED - tool_developer mise activate"
    block: |
      eval "$(~/.local/bin/mise activate {{ rc_file.name }})"
    create: true
  loop: "{{ shell_rc_files | default([]) }}"
  loop_control:
    loop_var: rc_file

- name: Add mise shims for non-interactive and login shells
  ansible.builtin.blockinfile:
    path: "{{ profile_file.path }}"
    marker: "# {mark} ANSIBLE MANAGED - tool_developer mise shims"
    block: |
      eval "$(~/.local/bin/mise activate {{ profile_file.name }} --shims)"
    create: true
  loop: "{{ tool_developer_profile_files }}"
  loop_control:
    loop_var: profile_file

- name: Ensure mise config directory exists
  ansible.builtin.file:
    dest: "{{ tool_developer_home }}/.config/mise/"
    state: directory
    mode: '0755'

- name: Deploy global mise config
  ansible.builtin.copy:
    src: config.toml
    dest: "{{ tool_developer_home }}/.config/mise/config.toml"
    mode: '0644'

- name: Install global tools from mise config
  ansible.builtin.command: "{{ tool_developer_home }}/.local/bin/mise install"
  register: tool_developer_mise_install
  changed_when: false