---
- name: Install global tools from mise config
  ansible.builtin.command: "{{ tool_developer_mise_bin }} install"
  register: tool_developer_mise_install
  changed_when: false

- name: Verify terraform is available through mise
  ansible.builtin.command: "{{ tool_developer_mise_bin }} exec -- terraform version"
  register: tool_developer_terraform_version
  changed_when: false
  failed_when: tool_developer_terraform_version.rc != 0