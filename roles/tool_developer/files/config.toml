# Global mise config - managed by Ansible (tool_developer).
# Edit this file in the repo directly; `mise use --global` writes are
# overwritten on the next playbook run.

[tools]
argocd = "latest"
bat = "latest"
fd = "latest"
gh = "latest"
hadolint = "latest"
herdr = "latest"
infisical = "latest"
jq = "latest"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
ripgrep = "latest"
terraform = "latest"
yq = "latest"