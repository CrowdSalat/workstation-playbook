# Global mise config - managed by Ansible (tool_developer).
# Edit this file in the repo directly; `mise use --global` writes are
# overwritten on the next playbook run.

[tools]
argocd = "latest"
bat = "latest"
fd = "latest"
gh = "latest"
go = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
golangci-lint = "latest"
hadolint = "latest"
herdr = "latest"
infisical = "latest"
jq = "latest"
make = "latest"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
pi = "latest"
ripgrep = "latest"
terraform = "latest"
yq = "latest"
