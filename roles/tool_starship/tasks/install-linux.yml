---
- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ tool_starship_local_bin }}"
    state: directory
    mode: "0755"

- name: Download Starship binary archive
  ansible.builtin.get_url:
    url: "{{ tool_starship_url }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/starship.tar.gz"
    mode: "0644"
    force: true

- name: Unarchive Starship into local bin
  ansible.builtin.unarchive:
    src: "{{ ansible_facts['env']['HOME'] }}/starship.tar.gz"
    dest: "{{ tool_starship_local_bin }}"
    remote_src: true
    creates: "{{ tool_starship_local_bin }}/starship"

- name: Verify Starship binary was extracted
  ansible.builtin.stat:
    path: "{{ tool_starship_local_bin }}/starship"
  register: tool_starship_binary

- name: Fail when Starship binary is missing
  ansible.builtin.assert:
    that:
      - tool_starship_binary.stat.exists
      - tool_starship_binary.stat.executable
    fail_msg: >-
      Starship archive extracted without producing
      {{ tool_starship_local_bin }}/starship
    success_msg: "Starship binary present at {{ tool_starship_local_bin }}/starship"

- name: Remove Starship archive
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/starship.tar.gz"
    state: absent
