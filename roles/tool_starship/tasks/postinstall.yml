---
- name: Ensure Starship config directory exists
  ansible.builtin.file:
    path: "{{ tool_starship_config_dir }}"
    state: directory
    mode: "0755"
  when: tool_starship_manage_config

- name: Manage Starship prompt config
  ansible.builtin.copy:
    dest: "{{ tool_starship_config_path }}"
    content: "{{ tool_starship_config | trim ~ '\n' }}"
    mode: "0644"
  when: tool_starship_manage_config

- name: Initialize Starship in shell configs
  ansible.builtin.blockinfile:
    path: "{{ rc_file.path }}"
    marker: "# {mark} ANSIBLE MANAGED - starship"
    block: |
      [[ "$TERM" != "dumb" ]] && eval "$({{ tool_starship_init_command }} init {{ rc_file.name }})"
    create: true
    insertafter: EOF
  loop: "{{ shell_rc_files }}"
  loop_control:
    loop_var: rc_file
