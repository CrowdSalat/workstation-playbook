---
- name: devspaces workstation
  hosts: localhost
  gather_facts: true

  vars:
    shell_rc_files:
      - { path: "{{ ansible_facts['env']['HOME'] }}/.bashrc", name: bash }
      - { path: "{{ ansible_facts['env']['HOME'] }}/.zshrc", name: zsh }
    roles_host:
      - tool_ssh
      - tool_git
      - tool_developer
      - tool_pre_commit
      - config_alias
      - tool_starship
      - config_agents_harnesses
      - tool_gcp
      - tool_oci
      - tool_vi

  tasks:
    - name: Apply enabled roles
      ansible.builtin.include_role:
        name: "{{ role_name }}"
      loop: "{{ roles_host }}"
      loop_control:
        loop_var: role_name
      tags:
        - tools
